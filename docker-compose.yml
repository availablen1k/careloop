version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: careloop-db
    restart: always
    environment:
      POSTGRES_DB: careloop
      POSTGRES_USER: careloop
      POSTGRES_PASSWORD: careloop
    ports:
      - "54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: careloop-mailhog
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:

